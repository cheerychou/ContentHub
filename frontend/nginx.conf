server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2g;

    location /api/ {
        proxy_pass http://api:8000;
    }

    # MinIO 预签名链接浏览器可达：Host 默认为 $proxy_host=minio:9000，签名依赖该 Host，勿改
    location /minio/ {
        proxy_pass http://minio:9000/;
    }
}
