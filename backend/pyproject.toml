[project]
name = "contenthub-backend"
version = "0.1.0"
description = "ContentHub M0 资产底座后端"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.13,<2.0",
    "edge-tts>=7.2,<8.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "minio>=7.2,<8.0",
    "python-multipart>=0.0.9,<1.0",
    "jinja2>=3.1,<4.0",
    "playwright>=1.45,<2.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # fastapi.testclient 重导出 starlette.testclient 时的三方弃用告警（非项目代码）
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
    # starlette.testclient 模块级 anyio 别名弃用告警（非项目代码）
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
