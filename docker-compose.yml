services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: contenthub
      POSTGRES_PASSWORD: contenthub
      POSTGRES_DB: contenthub
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contenthub"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: contenthub
      MINIO_ROOT_PASSWORD: contenthub123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      CH_DATABASE_URL: postgresql+psycopg://contenthub:contenthub@postgres:5432/contenthub
      CH_MINIO_ENDPOINT: minio:9000
      CH_MINIO_ACCESS_KEY: contenthub
      CH_MINIO_SECRET_KEY: contenthub123
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
